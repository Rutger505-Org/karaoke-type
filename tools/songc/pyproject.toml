[project]
name = "songc"
version = "0.1.0"
description = "KaraokeType song compile pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "demucs==4.0.1",
  "soundfile>=0.12",
  "numpy>=1.26,<3",
  "pyyaml>=6",
  "num2words>=0.5.13",
  "unidecode>=1.3",
]

[project.scripts]
songc = "songc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# CPU-only torch keeps the venv small (no CUDA wheels)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
